<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hilldale Display</title>

<style>
    body {
        background-color: #111;
        color: #fff;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        overflow: hidden;
    }
    #content {
        width: 80%;
        font-size: 3em;
        line-height: 1.5em;
        white-space: pre-wrap;
    }
    img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }
    iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
    #qr {
        position: absolute;
        bottom: 20px;
        right: 20px;
        background: #fff;
        padding: 10px;
        border-radius: 10px;
    }
</style>
</head>

<body>

<div id="content">Loading slides…</div>
<div id="qr"></div>

<script>
// CONFIGURATION
const SLIDE_DURATION = 10000; // 10 seconds

// URL to your OneDrive-hosted slides.json
// Example placeholder — replace with your real OneDrive link
const MANIFEST_URL = "https://tremblay1775.github.io/HilldaleKiosk/slides.json";

// MAIN LOGIC
let slides = [];
let index = 0;

// Load the manifest (slides.json)
async function loadManifest() {
    try {
        const response = await fetch(MANIFEST_URL);
        const data = await response.json();
        return data;
    } catch (e) {
        console.error("Error loading manifest:", e);
        return [];
    }
}

// Load text file content
async function loadTextFile(url) {
    try {
        const response = await fetch(url);
        return await response.text();
    } catch (e) {
        return "Error loading " + url;
    }
}

// Render slide
async function showSlide() {
    const slide = slides[index];
    const contentDiv = document.getElementById("content");
    const qrDiv = document.getElementById("qr");

    if (!slide) {
        contentDiv.textContent = "No slides found.";
        qrDiv.innerHTML = "";
        return;
    }

    // Clear QR each slide
    qrDiv.innerHTML = "";

    if (slide.type === "text") {
        const text = await loadTextFile(slide.url);
        contentDiv.innerHTML = text.replace(/\n/g, "<br>");
    }

    else if (slide.type === "image") {
        contentDiv.innerHTML = `<img src="${slide.url}">`;
    }

    else if (slide.type === "pdf") {
        contentDiv.innerHTML = `<iframe src="${slide.url}"></iframe>`;
    }

    // QR code support
    if (slide.qr) {
        const qrURL = encodeURIComponent(slide.qr);
        qrDiv.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${qrURL}">`;
    }

    index = (index + 1) % slides.length;
}

// Main loop
async function start() {
    slides = (await loadManifest()).slides;
    showSlide();

    setInterval(async () => {
        slides = await loadManifest(); // refresh manifest
        showSlide();
    }, SLIDE_DURATION);
}

start();
</script>

</body>
</html>
